name: Build Android AAB
on:
  push:
    branches: ["build-aab-*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#f97316' --splashBackgroundColor '#0f0f12' || true
      - run: npx cap sync android
      - name: Install website-only activity
        run: cp native/MainActivity.java android/app/src/main/java/com/appforge/instapro/MainActivity.java
      - name: Lock orientation and go full screen
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Set app version
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 10000/; s/versionName "[^"]*"/versionName "1.0.0"/' android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - name: Sign app bundle
        run: |
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass appforge -keypass appforge -dname "CN=Insta pro"
          jarsigner -keystore upload.jks -storepass appforge -keypass appforge -sigalg SHA256withRSA -digestalg SHA-256 android/app/build/outputs/bundle/release/app-release.aab upload
      - run: mv android/app/build/outputs/bundle/release/app-release.aab "insta-pro.aab"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: "insta-pro.aab"
